# RangerMarkdown as a crate: Ranger reads it (Import "src/lib.rs"), and a
# crate that uses its types names it as a path dependency. The library sits
# in Ranger's gallery/markdown, beside gallery/math.
[package]
name = "rangermarkdown"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

links = "rangermarkdown"

[lib]
path = "src/lib.rs"

[dependencies]
ranger = { path = "../../runtime/rust/ranger" }
rangermath = { path = "../math" }

# a target table: Ranger reads EVG from the .rgr files (rgr.rs), not this crate
[target.'cfg(all())'.dependencies]
rangerevg = { path = "../../runtime/rust/rangerevg" }

[build-dependencies]
ranger = { path = "../../runtime/rust/ranger" }
